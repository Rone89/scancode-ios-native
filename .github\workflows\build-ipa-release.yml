name: Build IPA and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    env:
      APP_NAME: ScanCode
      RELEASE_BASE_VERSION: "2.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ScanCode.xcodeproj \
            -scheme ScanCode \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${RELEASE_BASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          VERSION="${RELEASE_BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "${APP_NAME}.app" -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "Could not find built app bundle."
            find build/Build/Products -maxdepth 3 -print
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "${APP_PATH}" "Payload/${APP_NAME}.app"
          /usr/bin/zip -qry "${APP_NAME}-v${VERSION}.ipa" Payload

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${RELEASE_BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          cat > RELEASE_NOTES.md <<EOF
          # ScanCode v${VERSION}

          本版本由 GitHub Actions 在 macOS 26 / Xcode 26 环境中自动构建并上传。

          ## 功能说明

          - 使用系统原生 AVFoundation 实现二维码扫描。
          - 使用 iOS 26 原生 Liquid Glass 风格界面与系统组件。
          - 使用 AVCaptureVideoPreviewLayer 展示原生相机预览。
          - 识别成功时，通过 transformedMetadataObject(for:) 定位二维码并绘制绿色边框反馈。
          - 识别成功后触发 UIImpactFeedbackGenerator(style: .medium) 硬件震动反馈。
          - 支持双指捏合缩放，通过 AVCaptureDevice.videoZoomFactor 调节相机焦距。
          - 通用二维码选择微信后，直接拉起微信扫一扫，不再追加确认步骤。
          - 支持微信、支付宝和通用聚合支付二维码分发逻辑。
          - 支持多尺寸桌面小组件、锁屏小组件与灵动岛入口，提供扫码页、微信扫一扫、支付宝扫码快捷入口。
          - 内置新的应用图标资源。
          - 通过会话分辨率、识别区域、重复码冷却与帧率限制优化发热表现。

          ## 安装说明

          该 IPA 是 CI 生成的未签名构建产物，可用于验证编译和产物打包流程。若需真机分发安装，请配置 Apple Developer 证书和 provisioning profile 后重新签名。

          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanCode-ipa
          path: ScanCode-v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}.ipa

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}
          name: ScanCode v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: ScanCode-v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}.ipa
          make_latest: true
