name: Build IPA and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26

    env:
      APP_NAME: ScanCode
      RELEASE_BASE_VERSION: "2.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version

      - name: Build app
        run: |
          set -euo pipefail
          xcodebuild \
            -project ScanCode.xcodeproj \
            -scheme ScanCode \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="${RELEASE_BASE_VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          VERSION="${RELEASE_BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          APP_PATH="$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "${APP_NAME}.app" -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "Could not find built app bundle."
            find build/Build/Products -maxdepth 3 -print
            exit 1
          fi

          rm -rf Payload
          mkdir -p Payload
          cp -R "${APP_PATH}" "Payload/${APP_NAME}.app"
          /usr/bin/zip -qry "${APP_NAME}-v${VERSION}.ipa" Payload

      - name: Write release notes
        run: |
          set -euo pipefail
          VERSION="${RELEASE_BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          cat > RELEASE_NOTES.md <<EOF
          # ScanCode v${VERSION}

          本版本由 GitHub Actions 在 macOS 26 / Xcode 26 环境中自动构建并上传。

          ## 版本说明

          - 移除全部 WidgetKit 小组件和 Live Activity 扩展，不再随 App 打包小组件入口。
          - 移除小组件快捷指令深链和付款码快捷入口残留逻辑。
          - 启动页改为黑色背景，并延后数字雨 overlay 挂载，减少进入应用时的首帧闪烁。
          - 保留原生 AVFoundation 扫码、微信扫码跳转、支付宝扫码跳转和通用二维码选择逻辑。

          ## 安装说明

          该 IPA 是 CI 生成的未签名构建产物，可用于验证编译和打包流程。若需真机分发安装，请补充 Apple Developer 证书和 provisioning profile 后重新签名。

          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}
          EOF

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanCode-ipa
          path: ScanCode-v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}.ipa

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}
          name: ScanCode v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}
          body_path: RELEASE_NOTES.md
          files: ScanCode-v${{ env.RELEASE_BASE_VERSION }}.${{ github.run_number }}.ipa
          make_latest: true
